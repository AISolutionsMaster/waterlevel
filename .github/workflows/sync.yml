name: Hourly Water Level Sync

on:
  schedule:
    # Runs every hour at off-peak minute 17 (24 runs/day).
    # Script uses only Node.js built-ins — no npm install needed (~20s per run, ~8 mins/month).
    - cron: '17 * * * *'
  workflow_dispatch:
    # Allows manual triggering from the GitHub Actions UI
  repository_dispatch:
    # Allows external cron triggers (e.g., cron-job.org, Cloudflare Worker, Vercel) via GitHub API
    types: [sync_data]

concurrency:
  group: sync-water-levels
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Run Proxy Crawl and Sync Script
        # Node.js is pre-installed on ubuntu-latest runners — no setup or npm install needed
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node utils/sync-github-actions.js
