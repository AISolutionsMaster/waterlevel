name: Hourly Water Level Sync

on:
  schedule:
    # Runs every hour at off-peak minute 17 (24 runs/day).
    # Script uses only https-proxy-agent — no full npm ci needed (~30s per run).
    - cron: '17 * * * *'
  workflow_dispatch:
    # Allows manual triggering from the GitHub Actions UI
  repository_dispatch:
    # Allows external cron triggers (e.g., cron-job.org, Cloudflare Worker, Vercel) via GitHub API
    types: [sync_data]

concurrency:
  group: sync-water-levels
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Install proxy dependency
        # Only install the one package needed — skips full npm ci to stay fast
        run: npm install https-proxy-agent --no-save --no-package-lock

      - name: Run Proxy Crawl and Sync Script
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node utils/sync-github-actions.js
