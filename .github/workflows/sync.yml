name: Hourly Water Level Sync

on:
  schedule:
    # Runs once every 2 hours at minute 17 (12 runs/day). 
    # Since sync-github-actions.js fetches 6 hours of data, 0 data is ever lost.
    - cron: '17 */2 * * *'
  workflow_dispatch:
    # Allows manual triggering from the GitHub Actions UI
  repository_dispatch:
    # Allows external cron triggers (e.g., cron-job.org, Cloudflare Worker, Vercel) via GitHub API
    types: [sync_data]

concurrency:
  group: sync-water-levels
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Setup Node.js environment with npm cache
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run Proxy Crawl and Sync Script
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node utils/sync-github-actions.js


